pipeline:
  name: flutter-sdk-plugin-repo
  identifier: fluttersdkplugin
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: flutter-sdk-plugin
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Java
                  identifier: Install_Java
                  spec:
                    shell: Sh
                    command: |-
                      apt-get install -y openjdk-17-jdk -qq
                      java -version
              - step:
                  type: Run
                  name: Install Flutter
                  identifier: Install_Flutter
                  spec:
                    shell: Bash
                    command: |-
                      git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
                      export PATH="$HOME/flutter/bin:$PATH"
                      flutter --version
                      flutter config --no-analytics
                      flutter precache
              - step:
                  type: Run
                  name: Test splitio
                  identifier: Test_splitio
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/flutter/bin:$PATH"
                      cd splitio
                      flutter pub get
                      flutter test --coverage
              - step:
                  type: Run
                  name: Test splitio_android
                  identifier: Test_splitio_android
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/flutter/bin:$PATH"
                      cd splitio_android
                      flutter pub get
                      flutter test --coverage
              - step:
                  type: Run
                  name: Test splitio_ios
                  identifier: Test_splitio_ios
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/flutter/bin:$PATH"
                      cd splitio_ios
                      flutter pub get
                      flutter test --coverage
              - step:
                  type: Run
                  name: Test splitio_web
                  identifier: Test_splitio_web
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/flutter/bin:$PATH"
                      cd splitio_web
                      flutter pub get
                      flutter test --coverage --platform=chrome
              - step:
                  type: Run
                  name: Merge lcov
                  identifier: Merge_lcov
                  when:
                    stageStatus: Success
                    condition: <+matrix.sdkVersion> == "stable"
                  spec:
                    shell: Bash
                    command: |-
                      mkdir -p coverage
                      : > coverage/lcov.info
                      for f in splitio/coverage/lcov.info splitio_android/coverage/lcov.info splitio_ios/coverage/lcov.info splitio_web/coverage/lcov.info; do
                        if [ -s "$f" ]; then cat "$f" >> coverage/lcov.info; fi
                      done
                      test -s coverage/lcov.info
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  when:
                    stageStatus: Success
                    condition: <+matrix.sdkVersion> == "stable"
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: coverage/lcov.info
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/.dart_tool/**,**/test/**,**/*_test.dart"
        strategy:
          matrix:
            sdkVersion:
              - stable
